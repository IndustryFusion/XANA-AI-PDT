# Usually set through helm/values.yaml.gotmpl from an environment file; see helm/README.md.
imageRegistry: ghcr.io/industryfusion
# Empty uses the chart's appVersion, with a leading v.
imageTag: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

backend:
  image: xana-ai-pdt-backend
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  # The backend's settings, as environment variables. See backend/.env.example.
  # The addresses are the digital twin platform's services in namespace `iff`.
  config:
    LLM_PROVIDER: ollama
    LLM_MODEL: llama3.1
    LOG_LEVEL: INFO
    KEYCLOAK_REALM: iff
    KEYCLOAK_CLIENT_ID: scorpio
    NGSI_URL: http://scorpio-all-in-one-runner:9090
    PGREST_URL: http://pgrest:3000
    GATEWAY_KEYCLOAK_REALM: dataspace
    DATA_SHARING_POLICY: minimal
    INBOX_POLL_INTERVAL_S: "15"
    ALERTA_URL: http://alerta:8080/api
    ALERTS_REFRESH_INTERVAL_S: "30"
    FUSEKI_URL: http://fuseki:3030
    FUSEKI_DATASET: iff
    MQTT_BROKER_URL: mqtt://emqx-listeners:1883
    MQTT_MGMT_URL: http://emqx-dashboard:18083
    POSTGRES_SSLMODE: require
  # The backend's secrets, by variable name, in a Secret the chart creates. Never commit these.
  secret: {}
  # Without TIMESCALE_DB_URL and POSTGRES_MEMORY_URL in `secret`, both are built when the Pod starts from this
  # Secret's username and password. Set `secret` here to "" to give neither.
  postgresCredential:
    host: acid-cluster
    port: 5432
    timeseriesDatabase: tsdb
    memoryDatabase: memory
    # The database operator's Secret, with keys username and password, in the release's namespace.
    secret: ngb.acid-cluster.credentials
    # A Secret holding the database's CA certificate as ca.crt, for POSTGRES_SSLMODE verify-ca or verify-full.
    # It is mounted, and POSTGRES_SSLROOTCERT points at it.
    caSecret: ""
  # Variables read when the Pod starts from a key of a Secret in the release's namespace:
  #   - { variable: ALERTA_API_KEY, secret: alerta, key: alerta-admin-key }
  # A variable also in `secret` is taken from there.
  secretLookups: []

frontend:
  image: xana-ai-pdt-frontend
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: true
  className: nginx
  host: xana.example.org
  # For nginx. With another controller, set what it needs for 300 s calls and 64 MB bodies.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  # Name of a TLS Secret. Empty serves plain HTTP.
  tlsSecret: ""
