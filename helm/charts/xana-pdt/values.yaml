image:
  registry: ghcr.io/industryfusion
  # Empty uses the chart's appVersion, with a leading v.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

backend:
  image: xana-ai-pdt-backend
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

frontend:
  image: xana-ai-pdt-frontend
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Non-secret backend settings, as environment variables. See backend/.env.example.
# The addresses are the digital twin platform's services in namespace `iff`.
config:
  LLM_PROVIDER: ollama
  LLM_MODEL: llama3.1
  LOG_LEVEL: INFO
  # Sign-in: set KEYCLOAK_URL to Keycloak's external address to turn it on.
  KEYCLOAK_REALM: iff
  KEYCLOAK_CLIENT_ID: scorpio
  NGSI_URL: http://scorpio-all-in-one-runner:9090
  PGREST_URL: http://pgrest:3000
  GATEWAY_KEYCLOAK_REALM: dataspace
  DATA_SHARING_POLICY: minimal
  ALERTA_URL: http://alerta:8080/api
  ALERTS_REFRESH_INTERVAL_S: "30"
  FUSEKI_URL: http://fuseki:3030
  FUSEKI_DATASET: iff
  MQTT_BROKER_URL: mqtt://emqx-listeners:1883
  MQTT_MGMT_URL: http://emqx-dashboard:18083
  POSTGRES_SSLMODE: require

# Database addresses. The chart builds TIMESCALE_DB_URL and POSTGRES_MEMORY_URL from
# these and the credentials below, unless secrets.existingSecret supplies them.
database:
  host: acid-cluster
  port: 5432
  timeseriesName: tsdb
  memoryName: memory
  # Secret generated by the platform's database operator, with keys username and password.
  # It must be in the release's namespace.
  credentialsSecret: ngb.acid-cluster.credentials
  # A Secret holding the database's CA certificate. Set this with POSTGRES_SSLMODE
  # verify-ca or verify-full. It is mounted, and POSTGRES_SSLROOTCERT points at it.
  caCert:
    secret: ""
    key: ca.crt

secrets:
  # 1. A Secret holding every secret setting by variable name, including both database
  # URLs. If set, it replaces database.credentialsSecret and secrets.values.
  existingSecret: ""
  # 3. Values supplied at install time, for example ANTHROPIC_API_KEY. Never commit these.
  values: {}

ingress:
  enabled: true
  className: nginx
  host: xana.example.org
  # For nginx. With another controller, set what it needs for 300 s calls and 64 MB bodies.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  # Name of a TLS Secret. Empty serves plain HTTP.
  tlsSecret: ""
