# Usually set through helm/values.yaml.gotmpl from an environment file; see helm/README.md.
# The namespace the platform's Secrets are read from when deploying: the database operator's Secret, and each
# secretLookups entry without a namespace of its own. It changes no address.
platformNamespace: iff
# For the render checks only (helm/test/check_render.py): "<namespace>/<name>" to the Secret's keys, in plain
# text, read in place of the cluster's Secrets. Leave it unset.
testLookups: null
imageRegistry: ghcr.io/industryfusion
# Empty uses the chart's appVersion, with a leading v.
imageTag: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

backend:
  image: xana-ai-pdt-backend
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  # The backend's settings, as environment variables. See backend/.env.example.
  # The addresses are the digital twin platform's services in namespace `iff`, written out in full.
  config:
    LLM_PROVIDER: ollama
    LLM_MODEL: llama3.1
    LOG_LEVEL: INFO
    KEYCLOAK_REALM: iff
    KEYCLOAK_CLIENT_ID: scorpio
    NGSI_URL: http://scorpio-all-in-one-runner.iff.svc.cluster.local:9090
    PGREST_URL: http://pgrest.iff.svc.cluster.local:3000
    GATEWAY_KEYCLOAK_REALM: dataspace
    DATA_SHARING_POLICY: minimal
    INBOX_POLL_INTERVAL_S: "15"
    ALERTA_URL: http://alerta.iff.svc.cluster.local:8080/api
    ALERTS_REFRESH_INTERVAL_S: "30"
    FUSEKI_URL: http://fuseki.iff.svc.cluster.local:3030
    FUSEKI_DATASET: iff
    MQTT_BROKER_URL: mqtt://emqx-listeners.iff.svc.cluster.local:1883
    MQTT_MGMT_URL: http://emqx-dashboard.iff.svc.cluster.local:18083
    POSTGRES_SSLMODE: require
  # The backend's secrets, by variable name, in a Secret the chart creates. Never commit these.
  secret: {}
  # Without TIMESCALE_DB_URL and POSTGRES_MEMORY_URL in `secret`, both are built when the Pod starts from the
  # database credentials, which the chart stores percent-encoded in a Secret of its own: `databaseCredentials`
  # if both are set, else the Secret `postgresCredential.secret` read when deploying. With neither, the render
  # stops; without a cluster to read from (helm template), it notes that it didn't read them.
  databaseCredentials:
    username: ""
    password: ""
  postgresCredential:
    host: acid-cluster.iff.svc.cluster.local
    port: 5432
    timeseriesDatabase: tsdb
    memoryDatabase: memory
    # The database operator's Secret, with keys username and password, read in platformNamespace when
    # deploying unless databaseCredentials are given. Its values are stored percent-encoded in the chart's Secret.
    secret: ngb.acid-cluster.credentials
    # A Secret holding the database's CA certificate as ca.crt, for POSTGRES_SSLMODE verify-ca or verify-full.
    # It is mounted, and POSTGRES_SSLROOTCERT points at it.
    caSecret: ""
  # Variables read when deploying from a key of a Secret, in `namespace` or else platformNamespace, and copied
  # into the backend's Secret:
  #   - { variable: ALERTA_API_KEY, secret: alerta, key: alerta-admin-key }
  # A variable also in `secret` is taken from there.
  secretLookups: []

frontend:
  image: xana-ai-pdt-frontend
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: true
  className: nginx
  host: xana.example.org
  # For nginx. With another controller, set what it needs for 300 s calls and 64 MB bodies.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  # Name of a TLS Secret. Empty serves plain HTTP.
  tlsSecret: ""
