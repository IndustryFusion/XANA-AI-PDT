apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xana-pdt.backend" . }}
  labels: {{- include "xana-pdt.labels" . | nindent 4 }}
data:
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  {{- if .Values.database.caCert.secret }}
  POSTGRES_SSLROOTCERT: {{ include "xana-pdt.databaseCaPath" . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
