{{- $d := .Values.database }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xana-pdt.backend" . }}
  labels: {{- include "xana-pdt.labels" . | nindent 4 }}
spec:
  # Runs and their streams are held in the process, so there is exactly one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "xana-pdt.selector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xana-pdt.labels" . | nindent 8 }}
        {{- include "xana-pdt.selector" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: {{ include "xana-pdt.image" (dict "root" . "name" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "xana-pdt.backend" . }}
            {{- if .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
            {{- else if .Values.secrets.values }}
            - secretRef:
                name: {{ include "xana-pdt.backend" . }}
            {{- end }}
          {{- if and (not .Values.secrets.existingSecret) $d.credentialsSecret }}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $d.credentialsSecret }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $d.credentialsSecret }}
                  key: password
            - name: TIMESCALE_DB_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@{{ $d.host }}:{{ $d.port }}/{{ $d.timeseriesName }}
            - name: POSTGRES_MEMORY_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@{{ $d.host }}:{{ $d.port }}/{{ $d.memoryName }}
          {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
