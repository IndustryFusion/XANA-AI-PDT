{{- $d := .Values.backend.postgresCredential }}
{{- $r := include "xana-pdt.resolved" . | fromJson }}
{{- include "xana-pdt.checks" (dict "root" . "resolved" $r) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xana-pdt.backend" . }}
  labels: {{- include "xana-pdt.labels" . | nindent 4 }}
spec:
  # Runs and their streams are held in the process, so there is exactly one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "xana-pdt.selector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xana-pdt.labels" . | nindent 8 }}
        {{- include "xana-pdt.selector" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
        checksum/database: {{ include (print $.Template.BasePath "/database-secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "xana-pdt.image" (dict "root" . "name" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "xana-pdt.backend" . }}
            {{- if or $r.secret $r.pending }}
            - secretRef:
                name: {{ include "xana-pdt.backend" . }}
            {{- end }}
          {{- if ne $r.database.source "urls" }}
          env:
            # The database URLs, built when the Pod starts from the credentials in the chart's own Secret.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "xana-pdt.databaseSecret" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xana-pdt.databaseSecret" . }}
                  key: password
            {{- if not (or (hasKey $r.secret "TIMESCALE_DB_URL") (has "TIMESCALE_DB_URL" $r.pending)) }}
            - name: TIMESCALE_DB_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@{{ $d.host }}:{{ $d.port }}/{{ $d.timeseriesDatabase }}
            {{- end }}
            {{- if not (or (hasKey $r.secret "POSTGRES_MEMORY_URL") (has "POSTGRES_MEMORY_URL" $r.pending)) }}
            - name: POSTGRES_MEMORY_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@{{ $d.host }}:{{ $d.port }}/{{ $d.memoryDatabase }}
            {{- end }}
          {{- end }}
          {{- with $d.caSecret }}
          volumeMounts:
            - name: database-ca
              mountPath: {{ dir (include "xana-pdt.databaseCaPath" $) }}
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with $d.caSecret }}
      volumes:
        - name: database-ca
          secret:
            secretName: {{ . }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
