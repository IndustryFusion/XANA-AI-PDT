{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "xana-pdt.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - {{- with .Values.ingress.host }}
      hosts: [{{ . | quote }}]
      {{- end }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    # Without a host, the Ingress answers for any name.
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # The frontend forwards /api and /ws to the backend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "xana-pdt.frontend" . }}
                port:
                  name: http
{{- end }}
