{{- $db := (include "xana-pdt.resolved" . | fromJson).database }}
{{- if ne $db.source "urls" }}
# The database credentials, percent-encoded, for the database URLs the backend's Pod builds.
{{- if eq $db.source "offline" }}
{{ include "xana-pdt.offlineNote" . }}
# Not read: the database credentials, from Secret {{ .Values.backend.postgresCredential.secret }}.
{{- else if eq $db.source "lookup" }}
# Read when deploying from Secret {{ $db.secret }} in namespace {{ .Values.platformNamespace }}.
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xana-pdt.databaseSecret" . }}
  labels: {{- include "xana-pdt.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if ne $db.source "offline" }}
  username: {{ include "xana-pdt.percentEncode" $db.username | b64enc | quote }}
  password: {{ include "xana-pdt.percentEncode" $db.password | b64enc | quote }}
  {{- end }}
{{- end }}
