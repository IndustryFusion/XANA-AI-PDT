apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xana-pdt.frontend" . }}
  labels: {{- include "xana-pdt.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "xana-pdt.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xana-pdt.labels" . | nindent 8 }}
        {{- include "xana-pdt.selector" (dict "root" . "component" "frontend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "xana-pdt.image" (dict "root" . "name" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: XANA_BACKEND_URL
              value: http://{{ include "xana-pdt.backend" . }}:8000
          volumeMounts:
            # Over the image's own template, so the chart's configuration is the one nginx renders.
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "xana-pdt.frontend" . }}
