# Stand-ins for the platform's PostgreSQL and context broker, for trying the chart on a
# local cluster. Development only: the database trusts every connection, and the Secret
# holds a placeholder. Never use this on a shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: ngb.acid-cluster.credentials
stringData:
  username: xana
  # Characters that need percent-encoding in a URL, so the chart's encoding is exercised. The database
  # trusts every connection, so only the URL's form is checked, not the password.
  password: "p@ss:w/rd %+x"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acid-cluster
spec:
  replicas: 1
  selector:
    matchLabels: { app: acid-cluster }
  template:
    metadata:
      labels: { app: acid-cluster }
    spec:
      containers:
        - name: db
          image: timescale/timescaledb-ha:pg16
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: xana }
            - { name: POSTGRES_DB, value: memory }
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec:
              command: [pg_isready, -U, xana, -d, memory]
      volumes:
        - name: init
          configMap:
            name: xana-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: acid-cluster
spec:
  selector: { app: acid-cluster }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorpio-all-in-one-runner
spec:
  replicas: 1
  selector:
    matchLabels: { app: scorpio }
  template:
    metadata:
      labels: { app: scorpio }
    spec:
      containers:
        - name: broker
          image: scorpiobroker/all-in-one-runner:java-latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: DBHOST, value: acid-cluster }
            - { name: DBUSER, value: xana }
            - { name: DBPASS, value: unused }
            - { name: DBNAME, value: ngb }
---
apiVersion: v1
kind: Service
metadata:
  name: scorpio-all-in-one-runner
spec:
  selector: { app: scorpio }
  ports:
    - port: 9090
---
# Stand-ins for the cluster Secrets that envs/iff-cluster.sh reads. Test values only.
apiVersion: v1
kind: Secret
metadata:
  name: alerta
stringData:
  alerta-admin-key: local-test-alerta-key
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-client-secret-xana
stringData:
  CLIENT_ID: xana
  CLIENT_SECRET: local-test-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: xana-pdt-credentials
stringData:
  OPENAI_API_KEY: local-test-openai-key
