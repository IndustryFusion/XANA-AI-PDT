# Loads the sample machine data into the stand-in services.
apiVersion: batch/v1
kind: Job
metadata:
  name: xana-sample-data
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sample-data
          image: xana-local/xana-ai-pdt-backend:dev
          imagePullPolicy: Never
          command: [python, -m, sample_data]
          env:
            - { name: LLM_PROVIDER, value: scripted }
            - { name: NGSI_URL, value: "http://scorpio-all-in-one-runner:9090" }
            - { name: TIMESCALE_DB_URL, value: "postgresql://xana@acid-cluster:5432/tsdb" }
            - { name: POSTGRES_MEMORY_URL, value: "postgresql://xana@acid-cluster:5432/memory" }
