# The digital twin platform's services, in the release's namespace.
namespace: iff
imageRegistry: ghcr.io/industryfusion
imageTag: ""
imagePullPolicy: IfNotPresent

llmProvider: ollama
llmModel: llama3.1
llmProviderName: ""
ollamaUrl: ""
openaiBaseUrl: ""

# Sign-in. Empty turns it off. Use Keycloak's external address, as tokens must match the
# issuer that services check. Set XANA_KEYCLOAK_URL in the shell, or here.
keycloakUrl: ""
keycloakRealm: iff
keycloakClientId: scorpio
factoryId: ""

ngsiUrl: http://scorpio-all-in-one-runner:9090
# JSON-LD context for short names. Without it, names are the platform's full IRIs.
ngsiContextUrl: ""
pgrestUrl: http://pgrest:3000
# Alerts. The key comes from XANA_ALERTA_API_KEY, or the existing secret.
alertaUrl: http://alerta:8080/api
alertsRefreshIntervalS: 30
# The dataspace. Empty means none. The client secret and encryption key come from XANA_GATEWAY_CLIENT_SECRET
# and XANA_SETTINGS_ENCRYPTION_KEY, or the existing secret.
gatewayUrl: ""
gatewayKeycloakUrl: ""
gatewayKeycloakRealm: dataspace
gatewayClientId: ""
dataSharingPolicy: minimal
# Machine ontology and shapes. The graph base is http://<Fuseki's external host>/<realm> on the platform.
fusekiUrl: http://fuseki:3030
fusekiDataset: iff
fusekiGraphBase: http://fuseki.local/iff
# Live updates in the Data Explorer. Operators need Factory-Admin or Factory-Reader on client scorpio.
mqttBrokerUrl: mqtt://emqx-listeners:1883
mqttMgmtUrl: http://emqx-dashboard:18083
# The MQTT broker as Scorpio reaches it, if different.
mqttBrokerNotifyUrl: ""
databaseHost: acid-cluster
databasePort: 5432
databaseCredentialsSecret: ngb.acid-cluster.credentials
databaseCaSecret: ""
postgresSslMode: require
# Any other backend setting that is not secret, by variable name. See backend/.env.example.
extraConfig: {}
existingSecret: ""

# The platform's default ingress controller is Traefik; nginx is also supported.
ingressEnabled: true
ingressClass: traefik
ingressHost: xana.local
ingressTlsSecret: ""
