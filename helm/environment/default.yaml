# The digital twin platform's services, in the release's namespace.
namespace: iff
imageRegistry: ghcr.io/industryfusion
imageTag: ""
imagePullPolicy: IfNotPresent

llmProvider: ollama
llmModel: llama3.1
llmProviderName: ""
ollamaUrl: ""
openaiBaseUrl: ""

ngsiUrl: http://scorpio-all-in-one-runner:9090
databaseHost: acid-cluster
databasePort: 5432
databaseCredentialsSecret: ngb.acid-cluster.credentials
postgresSslMode: require
existingSecret: ""

# The platform's default ingress controller is Traefik; nginx is also supported.
ingressEnabled: true
ingressClass: traefik
ingressHost: xana.local
ingressTlsSecret: ""
