name: Deployment

on:
  pull_request:
    paths:
      - "frontend/Dockerfile"
      - "frontend/nginx/**"
      - "frontend/package*.json"
      - "frontend/index.html"
      - "frontend/vite.config.js"
      - "frontend/src/**"
      - "backend/Dockerfile"
      - "backend/pyproject.toml"
      - "backend/app/**"
      - "backend/migrations/**"
      - "backend/sample_data/**"
      - "backend/agent/pyproject.toml"
      - "backend/agent/xana_agent/**"
      - "backend/db-init/**"
      - "helm/**"
      - "build.sh"
      - "build.conf.example"
      - ".github/workflows/deployment.yml"
  push:
    branches: [main]
    paths:
      - "frontend/Dockerfile"
      - "frontend/nginx/**"
      - "frontend/package*.json"
      - "frontend/index.html"
      - "frontend/vite.config.js"
      - "frontend/src/**"
      - "backend/Dockerfile"
      - "backend/pyproject.toml"
      - "backend/app/**"
      - "backend/migrations/**"
      - "backend/sample_data/**"
      - "backend/agent/pyproject.toml"
      - "backend/agent/xana_agent/**"
      - "backend/db-init/**"
      - "helm/**"
      - "build.sh"
      - "build.conf.example"
      - ".github/workflows/deployment.yml"
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/industryfusion/xana-ai-pdt
  HELMFILE_VERSION: 1.1.9

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3 # Helmfile 1.1 does not support Helm 4
      - name: Lint
        run: helm lint helm/charts/xana-pdt
      - name: Check what the chart renders
        run: |
          pip install pyyaml
          python helm/test/check_render.py helm/charts/xana-pdt
      - name: Check the build script
        run: |
          shellcheck build.sh helm/test/build_test.sh
          helm/test/build_test.sh

  # The documented install on a local cluster, with stand-ins for the platform's services.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3 # Helmfile 1.1 does not support Helm 4
      - name: Install Helmfile
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v$HELMFILE_VERSION/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin helmfile
      - name: Check every environment renders
        working-directory: helm
        run: |
          for environment in default production local; do
            helmfile -e "$environment" template > /dev/null
          done
      - name: Check secrets from the shell reach the Secret, and never the ConfigMap
        working-directory: helm
        env:
          XANA_ANTHROPIC_API_KEY: helmfile-test-value
        run: |
          pip install pyyaml
          helmfile -e default template > rendered.yaml
          python - <<'EOF'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("rendered.yaml")) if d]
          [secret] = [d for d in docs if d["kind"] == "Secret"]
          assert secret["stringData"]["ANTHROPIC_API_KEY"] == "helmfile-test-value"
          assert not [d for d in docs if d["kind"] == "ConfigMap" and "helmfile-test-value" in str(d)]
          EOF
          rm rendered.yaml
      - uses: helm/kind-action@v1
        with:
          cluster_name: xana
          config: helm/test/kind.yaml
      - name: Build and load the images
        run: |
          docker build -t xana-local/xana-ai-pdt-backend:dev backend
          docker build -t xana-local/xana-ai-pdt-frontend:dev frontend
          kind load docker-image --name xana xana-local/xana-ai-pdt-backend:dev xana-local/xana-ai-pdt-frontend:dev
      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=complete job --all --timeout=180s
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=300s
          # Ready isn't enough: its admission webhook can take longer, and then an install fails.
          until kubectl create ingress webhook-check --rule='check.invalid/*=check:80' --dry-run=server -o name; do sleep 5; done
      - name: Install the stand-in services
        run: |
          kubectl create namespace iff
          kubectl -n iff create configmap xana-db-init --from-file=backend/db-init
          kubectl -n iff apply -f helm/test/stand-ins.yaml
          kubectl -n iff apply -f helm/test/sample-data.yaml
      - name: Install the release
        working-directory: helm
        run: helmfile -e local sync
      - name: All Pods reach ready
        run: |
          kubectl -n iff wait --for=condition=available deploy --all --timeout=600s
          kubectl -n iff wait --for=condition=complete job/xana-sample-data --timeout=600s
      - name: A run and its live stream through the Ingress
        run: |
          pip install httpx websockets
          python helm/test/smoke.py http://127.0.0.1 run --host xana.localhost
      - name: A restart keeps the run
        run: |
          kubectl -n iff rollout restart deploy/xana-pdt-backend
          kubectl -n iff rollout status deploy/xana-pdt-backend --timeout=300s
          python helm/test/smoke.py http://127.0.0.1 after-restart --host xana.localhost
      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n iff describe pods
          kubectl -n iff logs deploy/xana-pdt-backend --tail 200

  images:
    needs: [chart, install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build, with the build script in build-only mode
        run: REGISTRY="${IMAGE_PREFIX%/xana-ai-pdt}" IMAGE_TAG=ci ./build.sh --no-push
      - name: Check the images start as non-root
        run: |
          docker run --rm "$IMAGE_PREFIX-backend:ci" sh -c 'test "$(id -u)" != 0'
          docker run --rm "$IMAGE_PREFIX-frontend:ci" sh -c 'test "$(id -u)" != 0'
      - name: Publish from a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in backend frontend; do
            docker tag "$IMAGE_PREFIX-$image:ci" "$IMAGE_PREFIX-$image:$GITHUB_REF_NAME"
            docker push "$IMAGE_PREFIX-$image:$GITHUB_REF_NAME"
          done
