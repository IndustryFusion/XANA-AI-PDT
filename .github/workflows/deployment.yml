name: Deployment

on:
  pull_request:
    paths:
      - "frontend/Dockerfile"
      - "frontend/nginx/**"
      - "frontend/package*.json"
      - "frontend/index.html"
      - "frontend/vite.config.js"
      - "frontend/src/**"
      - "backend/Dockerfile"
      - "backend/pyproject.toml"
      - "backend/app/**"
      - "backend/migrations/**"
      - "backend/sample_data/**"
      - "backend/agent/pyproject.toml"
      - "backend/agent/xana_agent/**"
      - "backend/db-init/**"
      - "helm/**"
      - "build.sh"
      - ".env.example"
      - ".github/workflows/deployment.yml"
  push:
    branches: [main]
    paths:
      - "frontend/Dockerfile"
      - "frontend/nginx/**"
      - "frontend/package*.json"
      - "frontend/index.html"
      - "frontend/vite.config.js"
      - "frontend/src/**"
      - "backend/Dockerfile"
      - "backend/pyproject.toml"
      - "backend/app/**"
      - "backend/migrations/**"
      - "backend/sample_data/**"
      - "backend/agent/pyproject.toml"
      - "backend/agent/xana_agent/**"
      - "backend/db-init/**"
      - "helm/**"
      - "build.sh"
      - ".env.example"
      - ".github/workflows/deployment.yml"
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/industryfusion/xana-ai-pdt

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3 # Helmfile 1.1 does not support Helm 4
      - name: Lint
        # With test credentials: without database credentials the chart stops, as it should.
        run: helm lint helm/charts/xana-pdt --set backend.databaseCredentials.username=lint,backend.databaseCredentials.password=lint
      - name: Check what the chart renders
        run: |
          pip install pyyaml
          python helm/test/check_render.py helm/charts/xana-pdt
      - name: Check the build script
        run: |
          shellcheck build.sh helm/bootstrap.sh helm/envs/iff-cluster.sh helm/test/*.sh
          helm/test/build_test.sh

  # The documented install on a local cluster, with stand-ins for the platform's services.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3 # Helmfile 1.1 does not support Helm 4
      - name: Install Helmfile, with the pinned bootstrap
        working-directory: helm
        run: ./bootstrap.sh
      - name: Check every environment renders
        working-directory: helm
        env:
          DATABASE_USERNAME: render-check
          DATABASE_PASSWORD: render-check
        run: |
          for environment in default production; do
            ./helmfile -e "$environment" template > /dev/null
          done
      - name: Check secrets from the shell reach the Secret, and never the ConfigMap
        working-directory: helm
        env:
          ANTHROPIC_API_KEY: helmfile-test-value
          DATABASE_USERNAME: render-check
          DATABASE_PASSWORD: render-check
        run: |
          pip install pyyaml
          for environment in default production; do
            ./helmfile -e "$environment" template > rendered.yaml
            python - <<'EOF'
          import base64, yaml
          docs = [d for d in yaml.safe_load_all(open("rendered.yaml")) if d]
          [secret] = [d for d in docs if d["kind"] == "Secret" and d["metadata"]["name"] == "xana-pdt-backend"]
          assert base64.b64decode(secret["data"]["ANTHROPIC_API_KEY"]).decode() == "helmfile-test-value"
          assert not [d for d in docs if d["kind"] == "ConfigMap" and "helmfile-test-value" in str(d)]
          EOF
          done
          rm rendered.yaml
      - name: Check the environment keys, the values file and the old variables
        run: python helm/test/check_values.py helm
      - name: Check the layering of production, its overrides only, and that -e localAndIonos stops
        run: python helm/test/check_environments.py helm
      - uses: helm/kind-action@v1
        with:
          cluster_name: xana
          config: helm/test/kind.yaml
      - name: Build and load the images
        run: |
          docker build -t xana-local/xana-ai-pdt-backend:dev backend
          docker build -t xana-local/xana-ai-pdt-frontend:dev frontend
          kind load docker-image --name xana xana-local/xana-ai-pdt-backend:dev xana-local/xana-ai-pdt-frontend:dev
      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=complete job --all --timeout=180s
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=300s
          # Ready isn't enough: its admission webhook can take longer, and then an install fails.
          until kubectl create ingress webhook-check --rule='check.invalid/*=check:80' --dry-run=server -o name; do sleep 5; done
      - name: Install the stand-in services in iff, and XANA's test Secret in xana-pdt
        run: |
          kubectl create namespace iff
          kubectl -n iff create configmap xana-db-init --from-file=backend/db-init
          kubectl -n iff apply -f helm/test/stand-ins.yaml
          kubectl -n iff apply -f helm/test/sample-data.yaml
          kubectl create namespace xana-pdt
          kubectl -n xana-pdt apply -f helm/test/xana-pdt-test-secrets.yaml
      - name: The cluster-secrets helper
        env:
          IFF_NAMESPACE: iff
        run: helm/test/iff_cluster_test.sh
      - name: Install the release in xana-pdt, on the default environment with the local test values; the platform's Secrets are read when deploying
        working-directory: helm
        run: |
          test/local-values.sh > "$RUNNER_TEMP/local-values.yaml"
          ./helmfile -e default --state-values-file "$RUNNER_TEMP/local-values.yaml" sync
      - name: All Pods reach ready
        run: |
          kubectl -n iff wait --for=condition=available deploy --all --timeout=600s
          kubectl -n iff wait --for=condition=complete job/xana-sample-data --timeout=600s
          kubectl -n xana-pdt wait --for=condition=available deploy --all --timeout=600s
      - name: Secrets reach the backend from its own namespace
        run: |
          helm/test/check_cluster_secrets.sh xana-pdt
      - name: A run and its live stream through the Ingress
        run: |
          pip install httpx websockets
          python helm/test/smoke.py http://127.0.0.1 run --host xana.localhost
      - name: A restart keeps the run
        run: |
          kubectl -n xana-pdt rollout restart deploy/xana-pdt-backend
          kubectl -n xana-pdt rollout status deploy/xana-pdt-backend --timeout=300s
          python helm/test/smoke.py http://127.0.0.1 after-restart --host xana.localhost
      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n iff describe pods
          kubectl -n xana-pdt describe pods
          kubectl -n xana-pdt logs deploy/xana-pdt-backend --tail 200

  images:
    needs: [chart, install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build, with the build script in build-only mode
        run: REGISTRY="${IMAGE_PREFIX%/xana-ai-pdt}" IMAGE_TAG=ci ./build.sh --no-push
      - name: Check the images start as non-root
        run: |
          docker run --rm "$IMAGE_PREFIX-backend:ci" sh -c 'test "$(id -u)" != 0'
          docker run --rm "$IMAGE_PREFIX-frontend:ci" sh -c 'test "$(id -u)" != 0'
      - name: Publish from a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in backend frontend; do
            docker tag "$IMAGE_PREFIX-$image:ci" "$IMAGE_PREFIX-$image:$GITHUB_REF_NAME"
            docker push "$IMAGE_PREFIX-$image:$GITHUB_REF_NAME"
          done
