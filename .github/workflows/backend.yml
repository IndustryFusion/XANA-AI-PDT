name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/data/**"
      - "frontend/e2e/backend/**"
      - "frontend/playwright.config.js"
      - "frontend/package*.json"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/data/**"
      - "frontend/e2e/backend/**"
      - "frontend/playwright.config.js"
      - "frontend/package*.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/agent/pyproject.toml

      - name: Install
        run: pip install -e "./agent[anthropic,openai]" -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Agent package tests
        run: pytest agent/tests

      - name: Service tests (including database tests)
        run: pytest tests

      - name: Local environment file
        run: docker compose -f compose.yaml config --quiet

  # The UI on the backend data source against the local environment, with the
  # scripted language model and the sample data.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: scripted
    steps:
      - uses: actions/checkout@v4

      - name: Start the local environment
        run: docker compose -f compose.yaml --profile history --profile live --profile ontology --profile alerts up -d --build db broker sample-data backend pgrest-keys pgrest emqx fuseki sample-ontology alerta-db alerta sample-alerts

      - name: Wait for the sample data and the backend
        run: |
          machine=http://127.0.0.1:9090/ngsi-ld/v1/entities/urn:ngsi-ld:Machine:laser-cutter-01
          timeout 600 sh -c "until curl -sf -H 'Accept: application/json' $machine > /dev/null; do sleep 5; done"
          timeout 300 sh -c 'until curl -sf http://127.0.0.1:8000/api/agent/runs > /dev/null; do sleep 3; done'
          curl -s "http://127.0.0.1:8000/api/diagnostics?fresh=true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Service tests against the real broker and history service
        env:
          TEST_BROKER_URL: http://127.0.0.1:9090
          TEST_PGREST_URL: http://127.0.0.1:3000
          TEST_TSDB_URL: postgresql://xana@127.0.0.1:5432/tsdb
          TEST_FUSEKI_URL: http://127.0.0.1:3030
          FUSEKI_ADMIN_PASSWORD: admin
          TEST_ALERTA_URL: http://127.0.0.1:8082/api
          TEST_ALERTA_KEY: local-development-only-key
        run: |
          pip install -e ./agent -e ".[dev]"
          pytest tests/test_explorer_real.py tests/test_ontology_real.py tests/test_alerta_real.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the UI
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests on the backend data source
        working-directory: frontend
        env:
          XANA_BACKEND_URL: http://127.0.0.1:8000
        run: npm run test:e2e:backend

      - name: Local environment logs
        if: failure()
        run: docker compose -f compose.yaml logs --no-color --tail 300 backend sample-data broker pgrest emqx fuseki sample-ontology alerta sample-alerts

