# Local environment: backend, PostgreSQL with TimescaleDB, NGSI-LD context
# broker, Ollama and the sample machine data. Development only: the database
# trusts local connections and every port is bound to 127.0.0.1.
#
#   docker compose -f backend/compose.yaml up --build
#   LLM_PROVIDER=scripted docker compose -f backend/compose.yaml up --build   (no model download)
#
# Optional services, each under a profile (see backend/README.md):
#   --profile auth      Keycloak
#   --profile history   PostgREST, for the explorer's history and time-shift
#   --profile live      EMQX, for live updates in the explorer
#   --profile ontology  Fuseki with sample shapes and knowledge, for value hints
#
# Host ports can be changed with XANA_DB_PORT, XANA_BROKER_PORT, XANA_OLLAMA_PORT,
# XANA_KEYCLOAK_PORT, XANA_PGREST_PORT, XANA_MQTT_PORT, XANA_MQTT_MGMT_PORT, XANA_FUSEKI_PORT and XANA_BACKEND_PORT.

name: xana-ai-pdt

x-backend-env: &backend-env
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_MODEL: ${LLM_MODEL:-llama3.1}
  LLM_PROVIDER_NAME: ${LLM_PROVIDER_NAME:-}
  LLM_NUM_CTX: ${LLM_NUM_CTX:-32768}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  KEYCLOAK_URL: ${KEYCLOAK_URL:-}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-iff}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-scorpio}
  FACTORY_ID: ${FACTORY_ID:-}
  OLLAMA_URL: http://ollama:11434
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  DECISION_CONFIDENCE_THRESHOLD: ${DECISION_CONFIDENCE_THRESHOLD:-0.9}
  MAX_CONCURRENT_ROUNDS: ${MAX_CONCURRENT_ROUNDS:-2}
  NGSI_URL: http://broker:9090
  NGSI_CONTEXT_URL: ${NGSI_CONTEXT_URL:-}
  PGREST_URL: http://pgrest:3000
  FUSEKI_URL: http://fuseki:3030
  FUSEKI_DATASET: ${FUSEKI_DATASET:-iff}
  FUSEKI_GRAPH_BASE: ${FUSEKI_GRAPH_BASE:-}
  MQTT_BROKER_URL: mqtt://emqx:1883
  MQTT_MGMT_URL: http://emqx:18083
  TIMESCALE_DB_URL: postgresql://xana@db:5432/tsdb
  POSTGRES_MEMORY_URL: postgresql://xana@db:5432/memory
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: xana
      POSTGRES_DB: memory
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/home/postgres/pgdata
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${XANA_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xana", "-d", "memory"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Sign-in, on request. See backend/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [auth]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${XANA_KEYCLOAK_PORT:-8081}:8080"

  # Fetches Keycloak's keys when sign-in is on, as the platform does. Without sign-in nothing
  # sends a token, so any key will do. A secret of its own for every start, in a volume.
  pgrest-keys:
    image: busybox:1.36
    profiles: [history]
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-iff}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$KEYCLOAK_URL" ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /keys/jwk.json
          exit 0
        fi
        i=0
        until wget -q -O /keys/jwk.json "$$KEYCLOAK_URL/realms/$$KEYCLOAK_REALM/protocol/openid-connect/certs"; do
          i=$$((i + 1)); [ "$$i" -lt 60 ] || exit 1; sleep 3
        done
    volumes:
      - pgrest-keys:/keys

  # The attribute history over HTTP, on the platform's version. An empty XANA_PGREST_ANON_ROLE makes
  # it refuse requests without a token, as on the platform.
  pgrest:
    image: postgrest/postgrest:v12.0.0
    profiles: [history]
    environment:
      PGRST_DB_URI: postgres://xana@db:5432/tsdb
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: ${XANA_PGREST_ANON_ROLE-dbreader}
      PGRST_JWT_SECRET: "@/keys/jwk.json"
    volumes:
      - pgrest-keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
      pgrest-keys:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${XANA_PGREST_PORT:-3000}:3000"

  # On the platform's version. Here it takes any client; on the platform it checks a token and
  # a role, as backend/README.md says.
  emqx:
    image: emqx/emqx:5.8.8
    profiles: [live]
    ports:
      - "127.0.0.1:${XANA_MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${XANA_MQTT_MGMT_PORT:-18083}:18083"

  fuseki:
    image: stain/jena-fuseki:5.1.0
    profiles: [ontology]
    environment:
      ADMIN_PASSWORD: admin
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-iff}
    ports:
      - "127.0.0.1:${XANA_FUSEKI_PORT:-3030}:3030"

  sample-ontology:
    build: .
    image: xana-ai-pdt-backend:local
    profiles: [ontology]
    command: ["python", "-m", "sample_data", "ontology"]
    environment:
      <<: *backend-env
      FUSEKI_ADMIN_PASSWORD: admin
    depends_on:
      - fuseki
    restart: on-failure

  broker:
    image: scorpiobroker/all-in-one-runner:java-latest
    environment:
      DBHOST: db
      DBUSER: xana
      DBPASS: unused
      DBNAME: ngb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${XANA_BROKER_PORT:-9090}:9090"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${XANA_OLLAMA_PORT:-11434}:11434"

  # Downloads the model once; skipped when another provider is configured.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
    entrypoint: ["/bin/sh", "-c"]
    command: ['if [ "$$LLM_PROVIDER" = ollama ]; then ollama pull "$$LLM_MODEL"; else echo "LLM_PROVIDER=$$LLM_PROVIDER: no model download"; fi']
    depends_on:
      - ollama
    restart: on-failure

  sample-data:
    build: .
    image: xana-ai-pdt-backend:local
    command: ["python", "-m", "sample_data"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    restart: on-failure

  backend:
    build: .
    image: xana-ai-pdt-backend:local
    environment:
      <<: *backend-env
      BACKEND_HOST: 0.0.0.0
      BACKEND_RELOAD: "true"
    volumes:
      - ./app:/srv/backend/app:ro
      - ./migrations:/srv/backend/migrations:ro
      - ./agent/xana_agent:/srv/backend/agent/xana_agent:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${XANA_BACKEND_PORT:-8000}:8000"

volumes:
  db-data:
  ollama-models:
  pgrest-keys:
