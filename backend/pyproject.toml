[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xana-backend"
version = "0.1.0"
description = "XANA AI PDT backend service"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "xana-agent",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "google-re2>=1.1",
]

[project.optional-dependencies]
tracing = ["langfuse>=3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*", "sample_data*"]

[tool.setuptools.package-data]
sample_data = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "agent/tests"]
markers = [
  "db: needs PostgreSQL with TimescaleDB (TEST_DATABASE_URL)",
  "services: needs real platform services, each named by its own TEST_*_URL",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sample_data", "tests", "xana_agent"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]
